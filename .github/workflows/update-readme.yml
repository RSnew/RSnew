name: Update README Activity

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]

jobs:
  update-activity:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update recent activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch recent events
          ACTIVITY=$(gh api users/RSnew/events --jq '
            [.[] | select(.type == "PushEvent" or .type == "CreateEvent" or .type == "PullRequestEvent" or .type == "IssuesEvent") |
            {
              type: .type,
              repo: .repo.name,
              date: (.created_at | split("T")[0]),
              detail: (
                if .type == "PushEvent" then
                  "pushed \(.payload.commits | length) commit(s)"
                elif .type == "CreateEvent" then
                  "created \(.payload.ref_type) \(.payload.ref // "")"
                elif .type == "PullRequestEvent" then
                  "\(.payload.action) PR #\(.payload.pull_request.number)"
                elif .type == "IssuesEvent" then
                  "\(.payload.action) issue #\(.payload.issue.number)"
                else
                  .type
                end
              )
            }] | .[0:8] | .[] | "- **\(.date)** [\(.repo | split("/")[1])](https://github.com/\(.repo)): \(.detail)"
          ')

          # Also get system stats from the self-hosted runner
          UPTIME=$(uptime | sed 's/.*up /up /' | sed 's/,.*//')
          LOAD=$(sysctl -n vm.loadavg 2>/dev/null | awk '{print $2}' || echo "?")
          DISK=$(df -h / | tail -1 | awk '{print $4 " free"}')

          # Build the activity section
          cat > /tmp/activity_section.md << SECTION
          <!-- ACTIVITY_START -->
          $ACTIVITY

          <sub>🖥️ Self-hosted runner: $UPTIME | Load: $LOAD | Disk: $DISK | Updated: $(date -u '+%Y-%m-%d %H:%M UTC')</sub>
          <!-- ACTIVITY_END -->
          SECTION

          # Replace the activity section in README
          python3 << 'PYEOF'
          import re
          with open("README.md", "r") as f:
              content = f.read()
          with open("/tmp/activity_section.md", "r") as f:
              new_section = f.read().strip()
          content = re.sub(
              r"<!-- ACTIVITY_START -->.*?<!-- ACTIVITY_END -->",
              new_section,
              content,
              flags=re.DOTALL
          )
          with open("README.md", "w") as f:
              f.write(content)
          PYEOF

          echo "Activity section updated"

      - name: Generate machine status JSON for dashboard
        run: |
          UPTIME=$(uptime | sed 's/.*up //' | sed 's/,.*//')
          LOAD=$(sysctl -n vm.loadavg 2>/dev/null | awk '{print $2}' || echo "?")
          DISK=$(df -h / | tail -1 | awk '{print $4}')
          CPU=$(ps -A -o %cpu | awk '{s+=$1} END {printf "%.0f", s}')
          MEM=$(sysctl -n hw.memsize 2>/dev/null | awk '{printf "%.0f", $1/1024/1024/1024}')

          # Check services
          PROCS=$(ps aux)
          svc_qqbot=$(echo "$PROCS" | grep -c "nonebot\|xiaoer-qq-bot/main.py" || true)
          svc_napcat=$(echo "$PROCS" | grep -c "qemu.*napcat\|Napcat" || true)
          svc_runner=$(echo "$PROCS" | grep -c "Runner.Listener" || true)
          svc_danmaku=$(echo "$PROCS" | grep -c "danmaku\|9877" || true)
          svc_promptcraft=$(echo "$PROCS" | grep -c "promptcraft\|8088" || true)

          cat > /tmp/machine-status.json << STATUSEOF
          {
            "uptime": "$UPTIME",
            "load": "$LOAD",
            "memory_gb": $MEM,
            "disk_free": "$DISK",
            "cpu_pct": "$CPU",
            "services": {
              "QQ Bot": "$([ $svc_qqbot -gt 0 ] && echo online || echo offline)",
              "NapCat": "$([ $svc_napcat -gt 0 ] && echo online || echo offline)",
              "GitHub Runner": "$([ $svc_runner -gt 0 ] && echo online || echo offline)",
              "Danmaku": "$([ $svc_danmaku -gt 0 ] && echo online || echo offline)",
              "PromptCraft": "$([ $svc_promptcraft -gt 0 ] && echo online || echo offline)"
            },
            "updated": "$(date -u '+%Y-%m-%d %H:%M UTC')"
          }
          STATUSEOF

          # Push to github.io repo
          cd /Volumes/Mac/Code/RSnew.github.io
          cp /tmp/machine-status.json status.json
          git add status.json
          git diff --cached --quiet || (git commit -m "chore: update machine status [skip ci]" && git push)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update activity [skip ci]" && git push)
